name: Auto promote deploy to test_main

on:
  push:
    branches:
      - deploy

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR from deploy to test_main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --base test_main --head deploy --state open --json number --jq 'length')
          if [ "$EXISTING_PR" -eq "0" ]; then
            gh pr create \
              --base test_main \
              --head deploy \
              --title "Promote deploy to test_main" \
              --body "PR automático generado después del push en deploy para volver a validar antes de integrar en main."
          else
            echo "Ya existe un PR abierto de deploy hacia test_main."
          fi